<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "data": {"values": [{"case_id": "ai_education", "condition": "A", "value": 12.34400000000096}, {"case_id": "ai_education", "condition": "B", "value": 51.40699999999924}, {"case_id": "intelligent_ring", "condition": "B", "value": 59.18699999999808}]}, "mark": {"type": "point", "filled": true, "size": 90}, "encoding": {"color": {"field": "case_id", "title": "Case", "type": "nominal"}, "shape": {"field": "case_id", "type": "nominal"}, "tooltip": [{"field": "case_id", "type": "nominal"}, {"field": "condition", "type": "nominal"}, {"field": "value", "type": "quantitative"}], "x": {"field": "condition", "sort": ["A", "B", "C", "D"], "title": "Condition", "type": "nominal"}, "y": {"field": "value", "scale": {"zero": false}, "title": "first_mvp30_material_seconds", "type": "quantitative"}}, "height": 250, "title": "first_mvp30_material_seconds", "width": 360, "$schema": "https://vega.github.io/schema/vega-lite/v6.4.1.json"};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
